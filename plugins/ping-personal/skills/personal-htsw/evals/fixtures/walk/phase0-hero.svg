<text x="80" y="254" text-anchor="middle" style="fill:var(--hero-ink);font-family:var(--sans);font-size:22px;font-weight:600">measure</text>
<text x="240" y="254" text-anchor="middle" style="fill:var(--hero-ink);font-family:var(--sans);font-size:22px;font-weight:600">test</text>
