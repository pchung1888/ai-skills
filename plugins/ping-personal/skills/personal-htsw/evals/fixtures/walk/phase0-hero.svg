<path d="M229,174 H251 V192 H229 Z" style="fill:var(--hero-ink);stroke:var(--a);stroke-width:2.5;stroke-linejoin:round"/>
<path d="M400,218 V192" style="fill:none;stroke:var(--hero-ink);stroke-width:3.5;stroke-linecap:round"/>
<path d="M389,174 H411 V192 H389 Z" style="fill:var(--hero-ink);stroke:var(--a);stroke-width:2.5;stroke-linejoin:round"/>
