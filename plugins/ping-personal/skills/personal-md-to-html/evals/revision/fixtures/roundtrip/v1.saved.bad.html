<h1 data-rev-id="intro-h-1">Setup guide</h1>
<p data-rev-id="intro-p-1">Install the widget before you start the demo.</p>
<p data-rev-id="intro-p-2">Check that the lamp turns green after power on.</p>
<ul>
<li data-rev-id="intro-li-1">Keep the cable short.</li>
</ul>
</section>
<section id="steps">
<h2 data-rev-id="steps-h-1">Daily steps</h2>
<p data-rev-id="steps-p-1">Wipe the glass panel with a dry cloth.</p>
<p data-rev-id="steps-p-2">Log the reading in the blue notebook.</p>
<ul>
<li data-rev-id="steps-li-1">Close the lid when done.</li>
</ul>
